name: Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-distribution:
    name: Build unsigned Windows distribution
    runs-on: windows-2022
    timeout-minutes: 75
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release tag
        id: release_version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -ne "tag") {
            throw "Start Distribution from a tag matching the project version."
          }
          $metadata = Get-Content pyproject.toml -Raw
          $match = [regex]::Match(
            $metadata,
            '(?m)^version\s*=\s*"(?<version>[^"]+)"'
          )
          if (-not $match.Success) {
            throw "Could not read the application version from pyproject.toml."
          }
          $version = $match.Groups["version"].Value
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -cne $expectedTag) {
            throw "Release tag must be $expectedTag for project version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Restore locked dependencies
        run: uv sync --locked --extra supertonic

      - name: Install pinned Inno Setup compiler
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Download pinned Supertonic model
        env:
          MODEL_PATH: .build\supertonic-model-source
        run: |
          uv run python -c "import os; from supertonic.config import get_model_revision; from supertonic.loader import download_model; expected='724fb5abbf5502583fb520898d45929e62f02c0b'; actual=get_model_revision('supertonic-3'); assert actual == expected, f'Unexpected model revision: {actual}'; download_model(os.environ['MODEL_PATH'], 'supertonic-3')"

      - name: Build portable app, optional payloads, and installer
        run: >-
          .\build-tools\build.ps1
          -RebuildSupertonicPayload
          -ReleaseReady
          -SupertonicModelSource .\.build\supertonic-model-source

      - name: Smoke-test installer lifecycle
        run: .\build-tools\installer\smoke_test.ps1

      - name: Upload unsigned distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selectspeak-windows-unsigned-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/SelectSpeak-Setup-*.exe
            dist/SelectSpeak-Setup-*.exe.sha256
            dist/SelectSpeak-Supertonic-Dependencies-*-win-x64.zip
            dist/SelectSpeak-Supertonic-Model-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-diagnostics-${{ github.run_id }}
          path: |
            .build/pyinstaller
            .build/supertonic-frozen-probe.json
          if-no-files-found: ignore
          retention-days: 14

  draft-release:
    name: Create unsigned draft release
    needs: windows-distribution
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_NAME: selectspeak-windows-unsigned-${{ github.ref_name }}-${{ github.run_number }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir release-assets

      - name: Create unsigned draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.windows-distribution.outputs.version }}
        run: |
          $assetRoot = Join-Path $PWD "release-assets"
          $expectedAssets = @(
            "SelectSpeak-Setup-$env:RELEASE_VERSION.exe",
            "SelectSpeak-Setup-$env:RELEASE_VERSION.exe.sha256",
            "SelectSpeak-Supertonic-Dependencies-$env:RELEASE_VERSION-win-x64.zip",
            "SelectSpeak-Supertonic-Model-$env:RELEASE_VERSION.zip"
          )
          $assets = foreach ($name in $expectedAssets) {
            $path = Join-Path $assetRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release asset not found: $path"
            }
            (Resolve-Path -LiteralPath $path).Path
          }
          $unexpectedAssets = @(
            Get-ChildItem -LiteralPath $assetRoot -File -Recurse |
              Where-Object { $_.Name -notin $expectedAssets }
          )
          if ($unexpectedAssets.Count) {
            throw "Unexpected release assets: $($unexpectedAssets.FullName -join ', ')"
          }

          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A GitHub Release already exists for $env:RELEASE_TAG."
          }

          $changelogPath = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          if (-not (Test-Path -LiteralPath $changelogPath -PathType Leaf)) {
            throw "CHANGELOG.md was not found in release tag $env:RELEASE_TAG."
          }
          $changelog = Get-Content -LiteralPath $changelogPath -Raw
          $escapedVersion = [regex]::Escape($env:RELEASE_VERSION)
          $sectionPattern =
            "(?ms)^##[ \t]+$escapedVersion(?:[ \t]+-[ \t]+[^\r\n]+)?[ \t]*\r?\n" +
            "(?<content>.*?)(?=^##[ \t]+|\z)"
          $section = [regex]::Match($changelog, $sectionPattern)
          if (-not $section.Success -or -not $section.Groups["content"].Value.Trim()) {
            throw "CHANGELOG.md has no non-empty section for release version $env:RELEASE_VERSION. Add '## $env:RELEASE_VERSION - YYYY-MM-DD' before tagging."
          }
          $changelogSection = $section.Value.Trim()

          $notes = @"
          $changelogSection

          ---

          This is an **unsigned** SelectSpeak release. Windows may display an
          Unknown publisher or Microsoft Defender SmartScreen warning.

          SelectSpeak requires 64-bit Windows 10 version 1809 or later, or
          Windows 11. Setup requires an internet connection for the pinned
          Microsoft Speech SDK runtime. Supertonic is an optional local neural
          voice component and requires its two matching ZIP assets below.

          Before publishing this draft, review the generated assets and checksum,
          complete the unsigned release checklist, and document changes and known
          limitations. Do not describe this release as signed.

          Code-signing policy:
          https://github.com/${{ github.repository }}/blob/$env:RELEASE_TAG/docs/CODE_SIGNING_POLICY.md
          "@
          $notesPath = Join-Path $PWD "release-notes.md"
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8

          $arguments = @("release", "create", $env:RELEASE_TAG)
          $arguments += $assets
          $arguments += @(
            "--draft",
            "--verify-tag",
            "--title", "SelectSpeak $env:RELEASE_VERSION (Unsigned)",
            "--notes-file", $notesPath
          )
          & gh @arguments
          if ($LASTEXITCODE) {
            throw "Draft release creation failed with exit code $LASTEXITCODE."
          }
