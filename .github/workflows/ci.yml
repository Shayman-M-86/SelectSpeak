name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test, and package
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Restore locked dependencies
        run: uv sync --locked --extra supertonic

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run type checks
        run: uv run ty check --python-platform win32

      - name: Run unit tests
        run: uv run pytest

      - name: Verify Python package build
        run: uv build

      # The player is a separate process, so nothing above compiles it. Without
      # this a broken C# change reaches a release tag unnoticed: the release
      # build is the only other thing that builds it.
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build the WinUI player
        run: ./build-tools/winui/build.ps1

  dependency-audit:
    name: Audit locked dependencies
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Restore locked dependencies
        run: uv sync --locked --extra supertonic

      # The audit writes its reports under .build/security. They are not
      # uploaded as artifacts: a failure is read from this job's log, and the
      # reports are reproduced by running the script locally.
      - name: Audit Python and NuGet dependencies
        run: .\build-tools\security\audit_dependencies.ps1

