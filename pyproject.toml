[project]
name = "selectspeak"
version = "0.1.3"
description = "Read selected Windows text aloud with a global hotkey."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
supertonic = [
    "supertonic>=1.3.1,<2",
]

[project.scripts]
selectspeak = "selectspeak.__main__:main"

[project.urls]
Homepage = "https://github.com/Shayman-M-86/my-TTS"
Issues = "https://github.com/Shayman-M-86/my-TTS/issues"
Privacy = "https://github.com/Shayman-M-86/my-TTS/blob/main/PRIVACY.md"
Security = "https://github.com/Shayman-M-86/my-TTS/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pyinstaller>=6.16",
    "pytest>=8.4",
    "ruff>=0.12",
    "ty>=0.0.63",
    "types-pywin32",
]

[tool.ruff]
line-length = 110
src = ["src/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/python/selectspeak"]

[tool.pytest.ini_options]
pythonpath = ["src/python"]
testpaths = ["tests"]

[tool.ty.environment]
root = ["./src/python"]
